<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 454" width="840" height="454" role="img"><title>The plan and what happened</title><rect width='840' height='454' fill='#ffffff'/><text x="16.0" y="26.0" font-size="16" fill="#17202b" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">The plan, and what happened</text><text x="16.0" y="44.0" font-size="11" fill="#5c6776" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">The Nov 1 build order, written eleven days before the track opened, assumed decode-layer speed would decide the score.</text><text x="16.0" y="59.0" font-size="11" fill="#5c6776" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">Prefill and memory did, and most of the gain came from steps the plan didn't have.</text><text x="16.0" y="88.0" font-size="10" fill="#5c6776" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">PLANNED, IN BUILD ORDER</text><text x="16.0" y="282.0" font-size="10" fill="#5c6776" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">NOT ON THE PLAN</text><text x="16.0" y="108.0" font-size="12" fill="#17202b" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">1  Verify attention (decode)</text><rect x="262" y="96" width="118" height="17" rx="8" fill="#0f8a6a"/><text x="321.0" y="109.0" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="none" stroke-width="4" stroke-linejoin="round">shipped</text><text x="394.0" y="108.0" font-size="11" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">In p13 with the MoE kernel; the pair judged 1.070×</text><text x="16.0" y="138.0" font-size="12" fill="#17202b" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">2  MoE kernel, one weight layout</text><rect x="262" y="126" width="118" height="17" rx="8" fill="#1d6fb8"/><text x="321.0" y="139.0" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="none" stroke-width="4" stroke-linejoin="round">replaced</text><text x="394.0" y="138.0" font-size="11" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">In p13; prefill moved to grouped GEMMs (p16), then the upstream op (p19)</text><text x="16.0" y="168.0" font-size="12" fill="#17202b" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">3  Dense projections</text><rect x="262" y="156" width="118" height="17" rx="8" fill="#8a93a3"/><text x="321.0" y="169.0" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="none" stroke-width="4" stroke-linejoin="round">dropped</text><text x="394.0" y="168.0" font-size="11" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">About 1 ms of a 14.8 ms decode round, and over the byte budget</text><text x="16.0" y="198.0" font-size="12" fill="#17202b" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">4  Host-side drafter fixes</text><rect x="262" y="186" width="118" height="17" rx="8" fill="#8a93a3"/><text x="321.0" y="199.0" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="none" stroke-width="4" stroke-linejoin="round">dropped</text><text x="394.0" y="198.0" font-size="11" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">Later drafter ideas (prompt lookup, p22) were never judged</text><text x="16.0" y="228.0" font-size="12" fill="#17202b" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">5  Prefill kernels, last</text><rect x="262" y="216" width="118" height="17" rx="8" fill="#c2410c"/><text x="321.0" y="229.0" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="none" stroke-width="4" stroke-linejoin="round">most of the score</text><text x="394.0" y="228.0" font-size="11" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">p16 and p19 took the score from 1.104× to 1.457×</text><text x="16.0" y="302.0" font-size="12" fill="#17202b" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">Weight memory (p15)</text><rect x="322" y="290" width="58" height="17" rx="8" fill="none" stroke="#c2410c" stroke-width="1.5"/><text x="351.0" y="303.0" font-size="10" fill="#c2410c" text-anchor="middle" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">added</text><text x="394.0" y="302.0" font-size="11" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">13 GB back to the KV cache: 1.070× → 1.104×</text><text x="16.0" y="332.0" font-size="12" fill="#17202b" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">Split repeated prefill work by tokens (p21)</text><rect x="322" y="320" width="58" height="17" rx="8" fill="none" stroke="#c2410c" stroke-width="1.5"/><text x="351.0" y="333.0" font-size="10" fill="#c2410c" text-anchor="middle" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">added</text><text x="394.0" y="332.0" font-size="11" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">1.457× → 2.208×, more than half the track's gain</text><text x="16.0" y="362.0" font-size="12" fill="#17202b" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">Expert swaps (p24)</text><rect x="322" y="350" width="58" height="17" rx="8" fill="none" stroke="#c2410c" stroke-width="1.5"/><text x="351.0" y="363.0" font-size="10" fill="#c2410c" text-anchor="middle" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">added</text><text x="394.0" y="362.0" font-size="11" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">2.208× → 2.222×</text><text x="16.0" y="392.0" font-size="12" fill="#17202b" text-anchor="start" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">KV pool ratio flag</text><rect x="322" y="380" width="58" height="17" rx="8" fill="none" stroke="#c2410c" stroke-width="1.5"/><text x="351.0" y="393.0" font-size="10" fill="#c2410c" text-anchor="middle" font-weight="600" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">added</text><text x="394.0" y="392.0" font-size="11" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">2.222× → 2.315×; flags weren't allowed when I planned</text><text x="16.0" y="444.0" font-size="9.5" fill="#5c6776" text-anchor="start" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">Sources: serving/PLAN.md (Oct 25), serving/PLAN-v2.md (Nov 1), serving/notes/fable-gap-20261118.md; judged: runs/serving/.</text></svg>
