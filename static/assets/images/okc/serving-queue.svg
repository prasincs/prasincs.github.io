lo,monospace;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">36 h</text><line x1="580.8" y1="64" x2="580.8" y2="400" stroke="#d5dbe2"/><text x="580.8" y="414.0" font-size="10" fill="#5c6776" text-anchor="middle" font-weight="400" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">48 h</text><text x="220.0" y="82.0" font-size="10.5" fill="#17202b" text-anchor="end" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">p12 check</text><rect x="230" y="70" width="368.7" height="15" rx="3" fill="#1d6fb8"/><text x="604.7" y="82.0" font-size="10" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">50 h 27  ·  crashed (a hang fixed days earlier)</text><text x="220.0" y="104.0" font-size="10.5" fill="#17202b" text-anchor="end" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">p13 scored</text><rect x="230" y="92" width="84.0" height="15" rx="3" fill="#c2410c"/><text x="320.0" y="104.0" font-size="10" fill="#17202b" text-anchor="start" font-weight="400" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">11 h 30</text><text x="220.0" y="126.0" font-size="10.5" fill="#17202b" text-anchor="end" font-weight="400" style="font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;paint-order:stroke" stroke="#f6f8fa" stroke-width="4" stroke-linejoin="round">p15 scored</text><rect x="230" y="114" width="2.0" height="15" rx="3" fill="#c2410c"/><text x="238.0" y="126.0" fon