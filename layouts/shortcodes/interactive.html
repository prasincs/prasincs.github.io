{{- /* Embed a standalone interactive page from static/ (e.g. a 3D figure). Sizing is in assets/css/extended/custom.css.
     Usage: {{< interactive src="/okc/kernel-climb.html" height="1100" title="Kernel Climb" caption="..." >}} */ -}}
<figure class="interactive" style="--h:{{ .Get "height" | default "720" }}px">
  <iframe src="{{ .Get "src" }}" title="{{ .Get "title" | default "Interactive figure" }}" loading="lazy"></iframe>
  {{- if not ($.Page.Scratch.Get "interactiveResize") }}{{ $.Page.Scratch.Set "interactiveResize" true }}
  <script>
  /* Pages that report their own height ({type:"okc-height", h}) grow or shrink their frame; others keep the fixed height. */
  addEventListener("message", e => {
    if (!e.data || e.data.type !== "okc-height" || !(e.data.h > 100)) return;
    for (const f of document.querySelectorAll("figure.interactive iframe")) if (f.contentWindow === e.source) f.parentNode.style.setProperty("--h", Math.ceil(e.data.h) + 2 + "px");
  });
  </script>
  {{- end }}
  {{- with .Get "caption" }}<figcaption>{{ . }} <a href="{{ $.Get "src" }}">Open full screen</a></figcaption>{{ end }}
</figure>
