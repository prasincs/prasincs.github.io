# Netlify builds previews only; the live site stays on GitHub Pages (.github/workflows/hugo.yml, nextdoorhacker.com).
# Same Hugo as the Pages workflow. Pull requests and branch deploys include drafts and future-dated posts, so a
# post with `draft: true` can be read at its preview URL before it's published.

[build]
  publish = "public"
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

[build.environment]
  HUGO_VERSION = "0.146.0"
  HUGO_ENVIRONMENT = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildDrafts --buildFuture --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify --buildDrafts --buildFuture --baseURL $DEPLOY_PRIME_URL"
